<div class="app">
  <div class="block-main toolbar shadow shadow-b-2" style="z-index: 3">
    <img [routerLink]="'/'" src="assets/projectName.png" class="cursor_pointer" alt="" />
    <!--    <itsk-breadcrumb [menuItems]="menu" [currentItem]="current"></itsk-breadcrumb>-->
    <div style="margin-left: auto">
      <!--      <app-theme-switch></app-theme-switch>-->
    </div>
    <a
      class="button_ghost display-flex align-center margin-r-2"
      href="https://github.com/grafit-components/gt"
      target="_blank"
      rel="noopener"
      title="Репозиторий на GitHub"
      aria-label="Репозиторий на GitHub"
    >
      <svg width="20" height="20" viewBox="0 0 16 16" fill="white" aria-hidden="true">
        <path
          d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27s1.36.09 2 .27c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8z"
        />
      </svg>
    </a>
    <button class="btn-theme button_ghost display-flex align-center" (click)="onThemeToggle()" [title]="toggleThemeTitle">
      <itsk-icon
        [name]="currentTheme === 'light' ? 'icon-light_on-bulb-filled' : 'icon-light_off-bulb-dark-filled'"
        cssClass="display-flex align-center"
      />
    </button>
  </div>
  <div class="container container_auto overflow-hidden">
    <div class="container border-r-1px border-color_default">
      <itsk-menu [menu]="menu"></itsk-menu>
    </div>
    <div class="container container_column padding-10 container_auto scrollbar">
      <router-outlet></router-outlet>
    </div>
  </div>
</div>
